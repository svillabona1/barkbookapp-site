<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Already confirmed</title>
    <meta name="theme-color" content="#14261E" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/barkbook-mark-512.png" />
    <link rel="apple-touch-icon" href="/assets/barkbook-mark-512.png" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <a class="brand" href="/" aria-label="BarkBook home">
        <img class="mark" src="/assets/barkbook-mark-512.png" alt="BarkBook" />
      </a>

      <!-- VERBATIM port of confirm-consent alreadyBody(). Only changes: the
           privacy link points at /privacy.html and the reply-to renders as
           privacy@barkbookapp.com. -->
      <main class="card center">
        <p class="big-emoji">✅</p>
        <h1>Already confirmed</h1>
        <p>
          Thanks — this account's cloud backup is already switched on. Nothing
          more to do!
        </p>
        <p class="muted">
          To revoke consent and delete the cloud data, email
          <strong
            ><a href="mailto:privacy@barkbookapp.com"
              >privacy@barkbookapp.com</a
            ></strong
          >. Read the <a href="/privacy.html">privacy policy</a>.
        </p>
      </main>
    </div>
  </body>
</html>
