<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're all set!</title>
    <meta name="theme-color" content="#14261E" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/barkbook-mark-512.png" />
    <link rel="apple-touch-icon" href="/assets/barkbook-mark-512.png" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <a class="brand" href="/" aria-label="Barkbook home">
        <img class="mark" src="/assets/barkbook-mark-512.png" alt="Barkbook" />
      </a>

      <!-- Email-confirm landing: the target of signUp's emailRedirectTo. NO button
           pretends to open the PWA — iOS can't deep-link into a home-screen app from
           Safari, so the instruction itself is the call to action. -->
      <main class="card center">
        <p class="big-emoji">🐾</p>
        <h1>You're all set!</h1>
        <p>Your Barkbook account is confirmed.</p>
        <p>
          Open <strong>Barkbook</strong> from your home screen and sign in — your
          pack is waiting.
        </p>
      </main>
    </div>
  </body>
</html>
